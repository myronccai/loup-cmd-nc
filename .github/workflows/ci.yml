name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep in step with `loup` in package.lppkg.
      LOUP_VERSION: "1.26.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Loup ${{ env.LOUP_VERSION }}
        run: |
          curl -fsSL "https://github.com/code-craft-ai-company/loup-releases/releases/download/v${LOUP_VERSION}/loup-install.sh" \
            | sh -s -- --version "${LOUP_VERSION}" --no-modify-path -y
          echo "$HOME/.loup/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          loup --version
          loup-bootstrap --version
          python3 --version

      # The program is a script: there is nothing to build. `make ci`
      # type-checks it, runs the unit tests, and runs nc against nc on
      # 127.0.0.1 for the end-to-end tests (python3 finds free ports).
      - name: Check, unit tests and end-to-end tests
        run: make ci
